# Managed by whatfix/rms-service (FIX-135853) — do not edit here; changes are overwritten by
# the pod-branch-sync rollout. Logic lives in rms-service's pod-branch-sync-reusable.yml.
#
# Merges master (the source of truth, regardless of this repo's default branch) into every pod
# branch listed in the ARGUS_PODS org variable, via a PR merged with a merge commit (original
# commits and authors preserved). Merge conflicts raise an issue for the branch's owning team;
# other problems raise an infra issue for mama in rms-service.
name: Pod Branch Sync

on:
  push:
    branches: [master]
  # When a blocked sync is fixed, the developer's PR brings master into the pod branch. GitHub then
  # marks the bot's sync PR (head master) as merged, and this run closes the sync issue. Merges of
  # ordinary dev branches into pod branches are skipped by the job condition below and cost nothing.
  pull_request:
    types: [closed]
    branches: ['feature/pod_*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be synced without opening or merging PRs'
        type: boolean
        default: false

# issues: write is used only by the shared workflow's fallback step, to raise an infra issue
# when the sync App token can't be minted.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    # Runs on push to master and on manual dispatch. For pull_request events, runs only when a PR
    # from this repo's own master was merged into a pod branch *by GitHub automatically*, after a
    # conflict fix. The bot's own merges carry the pod-sync-auto-merged label and are skipped,
    # because the run that merged them has already done everything.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'master' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !contains(github.event.pull_request.labels.*.name, 'pod-sync-auto-merged'))
    uses: whatfix/rms-service/.github/workflows/pod-branch-sync-reusable.yml@master
    with:
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
